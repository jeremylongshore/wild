name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --no-server --parallel --display-cop-names

  boundary:
    # spec/dummy/ landed (review-wave f-x2-1/f-x2-2), so Packwerk boots and
    # runs a real check. Every lib/wild/<namespace>/package.yml now declares
    # a dependency on the root package ('.'), the substrate every tier is
    # allowed to use per ADR-0003 (Wild::Error subclasses, Wild.config,
    # Wild::Configuration, Wild::Engine). The ten lib/wild/<namespace>.rb
    # entry files are excluded in packwerk.yml (same treatment as the five
    # engine-substrate files): they are each namespace's own wiring/public
    # surface, structurally stuck in the root package by Ruby's file-per-
    # module convention, not a genuine root-to-namespace coupling (see
    # packwerk.yml's own comment for why a package.yml dependency was
    # rejected in favor of exclusion). `bundle exec packwerk check` is 0
    # offenses; the job blocks like every other required check.
    name: Namespace boundary (Packwerk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Packwerk check
        run: bundle exec packwerk check

  security:
    # bundler-audit works standalone so it runs unconditionally. brakeman
    # scans spec/dummy/ (the dummy Rails app the engine mounts into for CI
    # gates and the engine smoke spec, review-wave f-x2-1/f-x2-2) and is a
    # required check: with a real app to scan it either passes cleanly or
    # finds a real Rails-security warning, either way worth blocking on.
    name: Security (brakeman + bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: brakeman
        run: bundle exec brakeman --no-pager --quiet --no-progress -p spec/dummy

      - name: bundler-audit
        run: |
          bundle exec bundler-audit --update
          bundle exec bundler-audit check

  test:
    name: Test (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run RSpec with coverage
        env:
          COVERAGE: "1"
        run: bundle exec rspec --format documentation

      - name: Upload coverage to Codecov
        if: matrix.ruby-version == '3.3'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.xml,./coverage/.resultset.json
          fail_ci_if_error: false
          verbose: true

  ci-ok:
    # Fan-in gate: the single required status check for branch protection on
    # main. `boundary` (Packwerk) is now in `needs`: spec/dummy/ exists, the
    # root-substrate dependency is declared in every package.yml, and the
    # ten namespace entry files are excluded (packwerk.yml), so the lane is
    # a real, passing gate rather than an informational one.
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, boundary, security, test]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo "lint=${{ needs.lint.result }} boundary=${{ needs.boundary.result }} security=${{ needs.security.result }} test=${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && \
          [ "${{ needs.boundary.result }}" = "success" ] && \
          [ "${{ needs.security.result }}" = "success" ] && \
          [ "${{ needs.test.result }}" = "success" ]
