name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --no-server --parallel --display-cop-names

  boundary:
    # spec/dummy/ landed (review-wave f-x2-1/f-x2-2), so Packwerk now boots and
    # reports real results instead of crashing with "A Rails application could
    # not be found". It reports 465 real dependency-declaration violations,
    # though: every one of the ten lib/wild/<namespace>/package.yml files omits
    # a dependency on the root package ('.') even though each namespace's own
    # top-level entry file (e.g. lib/wild/admin_tools.rb, which defines
    # Wild::AdminTools) belongs to root, not to the namespace package, and
    # every namespace file references its own entry-point constant. That's a
    # package.yml declaration gap across all ten namespaces (see f-x2-5,
    # related but not identical), not a spec/dummy problem, and fixing ten
    # package.yml files is out of scope for the spec/dummy PR that fixed the
    # crash. The job stays informational until that gap has its own fix.
    # Tracked under bd `wild-rvv.9` (rails_ergonomics epic).
    name: Namespace boundary (Packwerk) [informational]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Packwerk check
        run: bundle exec packwerk check

  security:
    # bundler-audit works standalone so it runs unconditionally. brakeman
    # scans spec/dummy/ (the dummy Rails app the engine mounts into for CI
    # gates and the engine smoke spec, review-wave f-x2-1/f-x2-2) and is a
    # required check: with a real app to scan it either passes cleanly or
    # finds a real Rails-security warning, either way worth blocking on.
    name: Security (brakeman + bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: brakeman
        run: bundle exec brakeman --no-pager --quiet --no-progress -p spec/dummy

      - name: bundler-audit
        run: |
          bundle exec bundler-audit --update
          bundle exec bundler-audit check

  test:
    name: Test (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run RSpec with coverage
        env:
          COVERAGE: "1"
        run: bundle exec rspec --format documentation

      - name: Upload coverage to Codecov
        if: matrix.ruby-version == '3.3'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.xml,./coverage/.resultset.json
          fail_ci_if_error: false
          verbose: true

  ci-ok:
    # Fan-in gate: the single required status check for branch protection on
    # main. `boundary` (Packwerk) is deliberately NOT in `needs`: spec/dummy/
    # now exists and the lane runs to completion, but it reports 465 real
    # namespace-dependency violations (see the `boundary` job's own comment)
    # that predate this workflow change and are out of scope for it. Add
    # `boundary` to `needs` once those package.yml gaps are closed.
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo "lint=${{ needs.lint.result }} security=${{ needs.security.result }} test=${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && \
          [ "${{ needs.security.result }}" = "success" ] && \
          [ "${{ needs.test.result }}" = "success" ]
