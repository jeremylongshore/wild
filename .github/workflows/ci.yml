name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --no-server --parallel --display-cop-names

  boundary:
    # spec/dummy/ landed (review-wave f-x2-1/f-x2-2), so Packwerk boots and
    # runs a real check. `packwerk validate` runs first (review wave
    # f-x2-2): it catches malformed package.yml manifests (e.g. an unknown
    # key packwerk-extensions would need but this repo doesn't depend on)
    # before `check` ever runs, so a manifest typo fails loud instead of
    # silently narrowing what gets checked. Every lib/wild/<namespace>/
    # package.yml declares a dependency on the root package ('.'), the
    # substrate every tier is allowed to use per ADR-0003 (Wild::Error
    # subclasses, Wild.config, Wild::Configuration, Wild::Engine); the five
    # engine-substrate files those constants live in are no longer excluded
    # from packwerk.yml, so that edge is real (see packwerk.yml's own
    # comment for the full history, including a prior draft of this
    # comment that was wrong about the edge already doing that work). The
    # ten lib/wild/<namespace>.rb entry files are still excluded in
    # packwerk.yml: they are each namespace's own wiring/public surface,
    # structurally stuck in the root package by Ruby's file-per-module
    # convention, not a genuine root-to-namespace coupling. That exclusion
    # is a known, documented enforcement hole (review-wave f-x2-5,
    # packwerk.yml "KNOWN ENFORCEMENT HOLE"), not a gap this job silently
    # papers over. `bundle exec packwerk check` is 0 offenses; the job
    # blocks like every other required check.
    name: Namespace boundary (Packwerk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Packwerk validate
        run: bundle exec packwerk validate

      - name: Packwerk check
        run: bundle exec packwerk check

  security:
    # bundler-audit works standalone so it runs unconditionally. brakeman
    # scans the real gem source under lib/ (review wave f-x2-1: scanning
    # only spec/dummy/, an empty host app with 0 controllers/models, never
    # parsed lib/wild/** at all: a planted `system(...)` call in lib would
    # have passed clean). `--force` re-detects the app type despite the
    # missing app/ tree; `--skip-files spec/` keeps the scan to source, not
    # the dummy app or specs, since a Rails-app scan of spec/dummy alone
    # was the whole problem. Required check: it either passes cleanly or
    # finds a real Rails-security warning, either way worth blocking on.
    name: Security (brakeman + bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: brakeman
        run: bundle exec brakeman --force -p . --skip-files spec/ --no-pager --quiet --no-progress

      - name: bundler-audit
        run: |
          bundle exec bundler-audit --update
          bundle exec bundler-audit check

  test:
    name: Test (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run RSpec with coverage
        env:
          COVERAGE: "1"
        run: bundle exec rspec --format documentation

      - name: Upload coverage to Codecov
        if: matrix.ruby-version == '3.3'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.xml,./coverage/.resultset.json
          fail_ci_if_error: false
          verbose: true

  ci-ok:
    # Fan-in gate: the single required status check for branch protection on
    # main. `boundary` (Packwerk) is now in `needs`: spec/dummy/ exists, the
    # root-substrate dependency is declared in every package.yml, and the
    # ten namespace entry files are excluded (packwerk.yml), so the lane is
    # a real, passing gate rather than an informational one.
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, boundary, security, test]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo "lint=${{ needs.lint.result }} boundary=${{ needs.boundary.result }} security=${{ needs.security.result }} test=${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && \
          [ "${{ needs.boundary.result }}" = "success" ] && \
          [ "${{ needs.security.result }}" = "success" ] && \
          [ "${{ needs.test.result }}" = "success" ]
