name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --no-server --parallel --display-cop-names

  boundary:
    # Packwerk needs Rails-application context (spec/dummy/) AND per-namespace
    # package.yml files. Both are P1/P2 deliverables (Role 4 + Role 8). Until
    # then the job is informational: failure does NOT block PRs. Tracked under
    # bd `wild-rvv.1` (engine epic) and `wild-rvv.9` (rails_ergonomics epic).
    name: Namespace boundary (Packwerk) [informational]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Packwerk check
        run: bundle exec packwerk check

  security:
    # brakeman scans Rails apps. Until Role 8 lands spec/dummy/ in P2, brakeman
    # exits non-zero with "no Rails app found". bundler-audit DOES work standalone
    # so it runs unconditionally; brakeman runs informationally. Tracked under
    # bd `wild-rvv.9` (rails_ergonomics epic — spec/dummy lands with the generator).
    name: Security (brakeman + bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: brakeman (informational until spec/dummy lands in P2)
        continue-on-error: true
        run: bundle exec brakeman --no-pager --quiet --no-progress

      - name: bundler-audit
        run: |
          bundle exec bundler-audit --update
          bundle exec bundler-audit check

  test:
    name: Test (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run RSpec with coverage
        env:
          COVERAGE: "1"
        run: bundle exec rspec --format documentation

      - name: Upload coverage to Codecov
        if: matrix.ruby-version == '3.3'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.xml,./coverage/.resultset.json
          fail_ci_if_error: false
          verbose: true

  ci-ok:
    # Fan-in gate: the single required status check for branch protection on
    # main. `boundary` (Packwerk) is deliberately NOT in `needs` until
    # spec/dummy/ exists and the lane can pass; it stays informational.
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo "lint=${{ needs.lint.result }} security=${{ needs.security.result }} test=${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && \
          [ "${{ needs.security.result }}" = "success" ] && \
          [ "${{ needs.test.result }}" = "success" ]
