name: CodeQL

# CodeQL static analysis for jeremylongshore/wild.
# Strategy: 000-docs/007-AT-STND-codeql-strategy.md
# Repo config: .github/codeql/codeql-config.yml
#
# Triggers:
#   - pull_request to main → run before merge
#   - push to main → run after merge (catch direct pushes + post-merge state)
#   - schedule (weekly Sunday 04:17 UTC) → catch new queries published by GitHub
#     since last code change. Offset from 00:00/04:00 to dodge cron spikes.
#
# Permissions: least-privilege per GitHub Code Scanning docs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read
  actions: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ruby is the only source language (engine gem skeleton + Role 5 P1 moves)
          - language: ruby
            build-mode: none
          # `actions` queries scan .github/workflows/* — catches unsafe Actions
          # patterns (pull_request_target misuse, unpinned shas, script-injection
          # in `run:`, etc.). Equally important on a release-pipeline-bearing repo.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          # `category` differentiates Ruby vs Actions results in the Security tab
          # when both run in the same PR.
          category: "/language:${{ matrix.language }}"
