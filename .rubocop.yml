AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/*"
    - "spec/dummy/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "coverage/**/*"

plugins:
  - rubocop-rails
  - rubocop-rspec

Style/Documentation:
  Enabled: false

# New in RuboCop 1.90 (surfaced when Gemfile.lock was committed). It rewrites
# `disable`/`enable` pairs around a single statement into `disable-next-line`,
# which is comment-only churn across 42 spec files and is flagged unsafe because
# `disable-next-line` covers one line, not the multi-line block the pair guards.
# Disabled deliberately; revisit if the pairs are ever consolidated.
Style/DirectiveScope:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "wild.gemspec"
    - "Rakefile"

Metrics/MethodLength:
  Max: 20

Gemspec/DevelopmentDependencies:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 5

RSpec/ExampleLength:
  Max: 15

RSpec/NestedGroups:
  Max: 4
